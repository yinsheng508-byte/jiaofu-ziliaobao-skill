<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{书名}} 封面</title>
<style>
  @page { size: 210mm 297mm; margin: 0; }
  :root { --main:#1F6A73; --main2:#2F7F88; --deep:#14454C; --paper:#F4F1E8; --rule:#C9D3C6; --ink:#22302A; --ochre:#B08A45; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:210mm; height:297mm; }
  body { -webkit-print-color-adjust:exact; print-color-adjust:exact; background:var(--paper); }
  .cover { position:relative; width:210mm; height:297mm; overflow:hidden;
    background: radial-gradient(ellipse at 70% 28%, #FDFCF7 0%, rgba(253,252,247,0) 60%), linear-gradient(180deg,#F7F5EE 0%,#ECE8DB 100%); }
  .grain { position:absolute; inset:0; opacity:.4; }
  .contour { position:absolute; inset:0; }
  .spine { position:absolute; left:0; top:0; bottom:0; width:17mm;
    background:linear-gradient(90deg,#0F3A40 0%,var(--main) 40%,var(--main2) 74%,#1D5A62 100%); }
  .spine::before { content:""; position:absolute; inset:0; opacity:.3;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 .25mm,transparent .25mm .7mm); }
  .hinge { position:absolute; left:17mm; top:0; bottom:0; width:3.4mm; background:linear-gradient(90deg,rgba(15,58,64,.35),rgba(15,58,64,0)); }
  .spine-txt { position:absolute; left:0; width:17mm; top:40mm; writing-mode:vertical-rl; font-family:"FZDaBiaoSong-B06","Songti SC","SimSun","宋体",serif;
    font-size:12pt; letter-spacing:6pt; color:rgba(235,245,238,.86); display:flex; align-items:center; }
  .content { position:absolute; left:33mm; right:20mm; top:0; bottom:0; color:var(--ink); }
  .eyebrow { position:absolute; top:33mm; left:0; font-family:"PingFang SC","Microsoft YaHei","微软雅黑",sans-serif; font-weight:500; font-size:11pt; letter-spacing:4pt; color:var(--main2); }
  .year { position:absolute; top:45mm; left:0; font-family:"FZDaBiaoSong-B06","Songti SC","SimSun","宋体",serif; font-size:34pt; letter-spacing:2pt; line-height:1; }
  .rule { position:absolute; left:0; height:.35mm; background:var(--rule); }
  .r1 { top:64mm; right:0; }
  .title { position:absolute; top:75mm; left:-1mm; font-family:"FZDaBiaoSong-B06","Songti SC","SimSun","宋体",serif; font-size:80pt; line-height:1.14; letter-spacing:3pt; }
  .title .hl { color:var(--main); }
  .paren { position:absolute; top:153mm; left:-1mm; font-family:"FZDaBiaoSong-B06","Songti SC","SimSun","宋体",serif; font-size:30pt; letter-spacing:3pt; line-height:1; }
  .seal { position:absolute; top:149.5mm; left:78mm; width:15mm; height:15mm; border:.7mm solid #A8432E; border-radius:1.2mm; color:#A8432E;
    font-family:"FZDaBiaoSong-B06","Songti SC","SimSun","宋体",serif; font-size:13pt; line-height:1; display:grid; grid-template-columns:1fr 1fr; place-items:center;
    padding:1mm; transform:rotate(-4deg); opacity:.9; }
  .r2 { top:171mm; right:30mm; }
  .tag { position:absolute; top:179mm; left:0; font-family:"PingFang SC","Microsoft YaHei","微软雅黑",sans-serif; font-weight:500; font-size:12.5pt; letter-spacing:5pt; }
  .sub { position:absolute; top:189.5mm; left:0; font-family:"Kaiti SC",serif; font-size:12pt; letter-spacing:2pt; color:var(--main2); }
  .points { position:absolute; top:205mm; left:0; width:80mm; }
  .pt { display:flex; gap:3mm; align-items:baseline; padding:2.1mm 0; border-bottom:.25mm solid var(--rule); }
  .pt:first-child { border-top:.25mm solid var(--rule); }
  .pt .no { font-family:"Iowan Old Style",Georgia,serif; font-style:italic; font-size:11pt; color:var(--main2); width:6mm; flex:none; }
  .pt .h { font-family:"PingFang SC","Microsoft YaHei","微软雅黑",sans-serif; font-weight:600; font-size:10.5pt; letter-spacing:1pt; }
  .pt .s { display:block; margin-top:.6mm; font-weight:400; font-size:8pt; letter-spacing:.5pt; opacity:.62; }
  .foot { position:absolute; left:0; bottom:13mm; font-family:"PingFang SC","Microsoft YaHei","微软雅黑",sans-serif; font-size:9pt; letter-spacing:2pt; color:#7C8B82; }
  .globe { position:absolute; right:-18mm; bottom:-14mm; width:128mm; height:150mm; opacity:.92; }
  .era { position:absolute; right:13mm; top:33mm; writing-mode:vertical-rl; font-family:"Songti SC","SimSun","宋体",serif; font-size:9.5pt; letter-spacing:3pt; color:#7F9488; }
</style>
</head>
<body>
<div class="cover">
  <svg class="grain" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.5  0 0 0 0 0.4  0 0 0 0.10 0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
  {{装饰1}}
  <div class="spine"></div>
  <div class="hinge"></div>
  <div class="spine-txt">{{学科}} · {{年级}}</div>
  {{装饰2}}
  <div class="content">
    <div class="eyebrow">{{教材版本}} · {{用途}}</div>
    <div class="year">{{年级}}</div>
    <div class="rule r1"></div>
    <div class="title"><span class="hl">{{学科}}</span><br>{{书名后半}}</div>
    <div class="paren">（{{版}}）</div>
    <div class="seal">{{印}}</div>
    <div class="rule r2"></div>
    <div class="tag">课本同步 · {{口号}}</div>
    <div class="sub">{{副标题}}</div>
    <div class="points">
      <div class="pt"><span class="no">01</span><span class="h">{{卖点1}}<span class="s">{{卖点1说明}}</span></span></div>
      <div class="pt"><span class="no">02</span><span class="h">{{卖点2}}<span class="s">{{卖点2说明}}</span></span></div>
      <div class="pt"><span class="no">03</span><span class="h">{{卖点3}}<span class="s">{{卖点3说明}}</span></span></div>
      <div class="pt"><span class="no">04</span><span class="h">{{卖点4}}<span class="s">{{卖点4说明}}</span></span></div>
    </div>
    <div class="foot">{{结构}} · {{空数}} 个关键词</div>
  </div>
  <div class="era">{{章节一览}}</div>
</div>
</body>
</html>
