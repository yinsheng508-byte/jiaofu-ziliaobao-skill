<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>七上英语语法手册 封面</title>
<style>
  @page { size: 210mm 297mm; margin: 0; }
  :root {
    --navy: #13305E;
    --navy-2: #1E4380;
    --paper: #F4F6F9;
    --rule: #B9C7DD;
    --ink: #13305E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 210mm; height: 297mm; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: var(--paper); }
  .cover { position: relative; width: 210mm; height: 297mm; overflow: hidden;
    background:
      radial-gradient(ellipse at 70% 35%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, #F7F8FB 0%, #EEF1F6 100%);
  }
  .grain { position: absolute; inset: 0; opacity: .35; }

  /* 书脊：布面深蓝 + 压痕 */
  .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 17mm;
    background: linear-gradient(90deg, #0E2448 0%, var(--navy) 35%, var(--navy-2) 70%, #183A70 100%); }
  .spine::before { content: ""; position: absolute; inset: 0; opacity: .25;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 .25mm, transparent .25mm .7mm); }
  .hinge { position: absolute; left: 17mm; top: 0; bottom: 0; width: 3.2mm;
    background: linear-gradient(90deg, rgba(14,36,72,.35), rgba(14,36,72,0)); }

  .content { position: absolute; left: 33mm; right: 22mm; top: 0; bottom: 0; color: var(--ink); }

  .eyebrow { position: absolute; top: 34mm; left: 0; font-family: "PingFang SC", "Microsoft YaHei", "微软雅黑", sans-serif; font-weight: 500;
    font-size: 11.5pt; letter-spacing: 4pt; color: #4A618A; }
  .year { position: absolute; top: 47mm; left: 0; font-family: "FZDaBiaoSong-B06", "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 36pt; letter-spacing: 1pt; line-height: 1; }
  .rule { position: absolute; left: 0; height: .35mm; background: var(--rule); }
  .r1 { top: 67mm; right: 0; }
  .title { position: absolute; top: 79mm; left: -1mm; font-family: "FZDaBiaoSong-B06", "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 84pt; line-height: 1.12; letter-spacing: 2pt; }
  .paren { position: absolute; top: 160mm; left: -1mm; font-family: "FZDaBiaoSong-B06", "Songti SC", "STSong", "SimSun", "宋体", serif;
    font-size: 30pt; letter-spacing: 2pt; line-height: 1; }
  .r2 { top: 177mm; right: 26mm; }
  .tag { position: absolute; top: 186mm; left: 0; font-family: "PingFang SC", "Microsoft YaHei", "微软雅黑", sans-serif; font-weight: 500;
    font-size: 13pt; letter-spacing: 5pt; color: var(--ink); }
  .en { position: absolute; top: 197mm; left: 0; font-family: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
    font-style: italic; font-size: 13pt; letter-spacing: .6pt; color: #4A618A; }
  .art { position: absolute; right: 8mm; bottom: 14mm; width: 108mm; height: 92mm; }
  .foot { position: absolute; left: 0; bottom: 18mm; font-family: "PingFang SC", "Microsoft YaHei", "微软雅黑", sans-serif; font-size: 9pt;
    letter-spacing: 2pt; color: #6C80A3; line-height: 1.9; }
  .points { position: absolute; top: 211mm; left: 0; width: 60mm; }
  .pt { display: flex; gap: 3mm; align-items: baseline; padding: 2.1mm 0; border-bottom: .25mm solid var(--rule); }
  .pt:first-child { border-top: .25mm solid var(--rule); }
  .pt .no { font-family: "Iowan Old Style", Georgia, "Times New Roman", serif; font-style: italic; font-size: 11pt; color: var(--navy-2); width: 6mm; flex: none; }
  .pt .h { font-family: "PingFang SC", "Microsoft YaHei", "微软雅黑", sans-serif; font-weight: 600; font-size: 10.5pt; color: var(--ink); letter-spacing: 1pt; }
  .pt .s { display: block; margin-top: .6mm; font-family: "PingFang SC", "Microsoft YaHei", "微软雅黑", sans-serif; font-weight: 400; font-size: 8pt; letter-spacing: .5pt; opacity: .62; }
  .foot { bottom: 14mm !important; }
</style>
</head>
<body>

    <div class="foot">Starter – Unit 7　·　8 单元 · 21 个语法点 · 376 道练习</div>
  </div>
